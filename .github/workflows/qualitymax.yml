name: QualityMax Staging Demo Setup

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check staging project linkage and script count
        env:
          QUALITYMAX_TOKEN: ${{ secrets.QUALITYMAX_API_KEY }}
        run: |
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          api=https://pantheon.qualitymax.io/api/github-action
          get() {
            curl --silent --show-error --max-time 45 --output "$response" --write-out '%{http_code}' \
              --user-agent 'QualityMax-GitHub-Action/1.1' \
              --header "X-API-Key: $QUALITYMAX_TOKEN" "$api/$1"
          }
          status="$(get 'resolve-project?repository=Quality-Max%2Fqualitymax-demo-playground')"
          echo "Staging repo resolution returned HTTP $status."
          [[ "$status" == 200 ]]
          project_id="$(jq -er '.project_id | tostring | select(test("^[0-9]+$"))' "$response")"
          echo "Staging project ID $project_id."
          status="$(get "projects/$project_id/tests")"
          echo "Staging script lookup returned HTTP $status."
          [[ "$status" == 200 ]]
          jq -er '"Stored scripts: \(.total | numbers)"' "$response"
