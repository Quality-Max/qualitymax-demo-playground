name: QualityMax AI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  qualitymax:
    name: Run QualityMax Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    # The released action uses Playwright 1.49, which supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Send each parallel runner its Playwright shard number.
    strategy:
      fail-fast: false  # don't cancel other shards if one fails
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run QualityMax Tests
        uses: Quality-Max/qualitymax-github-action@v1
        with:
          api-key: ${{ secrets.QUALITYMAX_API_KEY }}
          # Resolve the staging project from this linked repository.
          test-suite: 'all'
          browser: 'chromium'
          base-url: 'https://demo.playwright.dev/todomvc'
          shard: ${{ matrix.shard }}
          shards-total: 2
          fail-on-test-failure: 'true'
          post-pr-comment: 'true'
        env:
          QUALITYMAX_API_URL: https://pantheon.qualitymax.io/api
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
